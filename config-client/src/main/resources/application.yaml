spring:
  application:
    name: config-client
  config:
    import: "configserver:,vault://"
  cloud:
    config:
      uri: http://localhost:8888
    vault:
      host: localhost
      port: 8200
      scheme: http
      authentication: token
      token: root
      kv:
        enabled: true
        backend: secret

management:
  endpoints:
    web:
      exposure:
        include: refresh